<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Freeform 3D Building Creator</title>
<style>

html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:12px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{display:grid;height:100%;grid-template:34px 1fr auto/50px 1fr 200px}

#tb button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px;padding:7px 0;font-size:10px;cursor:pointer}#tb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#vp{position:relative;min-width:0;min-height:0}#cv{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:8px;top:8px;background:#000a;color:#fff;padding:5px 9px;border-radius:6px;pointer-events:none;max-width:70%}
#in{background:var(--pn);border-left:1px solid var(--bd);overflow-y:auto;padding:8px}
#in label{display:block;margin:5px 0;color:var(--mu)}#in input,#in select{width:100%;box-sizing:border-box;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:3px;font:inherit}
.ls{max-height:110px;overflow:auto;border:1px solid var(--bd);border-radius:4px}.r{padding:3px 6px;cursor:pointer}.r.on{background:var(--ac);color:#fff}.dim{opacity:.45}.mu{color:var(--mu)}
.bt{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.bt button,#bb button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:5px;padding:4px 7px;font:inherit;cursor:pointer}
#bb{grid-column:1/4;background:var(--pn);border-top:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:4px 10px;padding:4px 8px;align-items:center}
#bb label{display:flex;gap:4px;align-items:center;color:var(--mu)}#bb input[type=number]{width:46px}#bb input,#bb select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px;font:inherit}#bb input[type=range]{width:70px}
#mod{display:none;position:fixed;inset:0;background:#000b;z-index:9;align-items:center;justify-content:center}#mod.o{display:flex}#mod div{background:var(--pn);padding:12px;border-radius:8px;width:min(560px,92vw);max-height:88vh;overflow:auto}#mod textarea{width:100%;height:240px;background:var(--bg);color:var(--tx)}#mod img{max-width:100%}
@media(max-width:760px){#app{grid-template-columns:44px 1fr 150px}#bb{font-size:11px}}
</style></head><body>
<div id=app><div id=mn></div><div id=tb></div><div id=vp><canvas id=cv></canvas><div id=hud></div></div><div id=in></div>
<div id=bb>
<label>Height<input data-s=h type=number step=.1 value=3></label><label>Thick<input data-s=t type=number step=.05 value=.25></label>
<label>Opening<select data-s=ow><option>none<option>door<option>window</select></label>
<label>Snap<select data-s=snap><option value=0>off<option value=.25>.25<option value=.5 selected>.5<option value=1>1</select></label>
<label>Bevel<input data-s=bv type=number step=.02 min=0 value=0></label>
<label>Material<select data-s=m id=qm></select></label>
<label>Brush<input data-s=br type=range min=1 max=12 value=4></label><label>Lower<input data-s=low type=checkbox></label>
<label>Grass<input data-s=gd type=range min=10 max=200 value=60></label>
<label>Plant<select data-s=pl><option>oak<option>pine<option>rock<option>flower</select></label>
<label>Time<input data-s=time type=range min=0 max=24 step=.1 value=14></label><label>Cycle<input data-s=cyc type=checkbox></label>
<label>Wind<input data-s=wind type=range min=0 max=3 step=.1 value=1></label><label>Fog<input data-s=fog type=range min=0 max=1 step=.01 value=.05></label>
</div></div>
<div id=mod><div><p id=mt></p><textarea id=ta></textarea><img id=mi><div class=bt><button id=ml>Load</button><button onclick="mod.classList.remove('o')">Close</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),T=THREE,mod=$('#mod'),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const cv=$('#cv'),R=new T.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
R.shadowMap.enabled=true;R.toneMapping=T.ACESFilmicToneMapping;R.outputEncoding=T.sRGBEncoding;R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new T.Scene(),PC=new T.PerspectiveCamera(50,1,.1,600),OC=new T.OrthographicCamera(-1,1,1,-1,-600,600);let cam=PC,ortho=false,walk=false,W=1,H=1;
const hemi=new T.HemisphereLight(0xcfe4ff,0x555544,.6),sun=new T.DirectionalLight(0xfff2dd,1.1);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const shc=sun.shadow.camera;shc.left=shc.bottom=-60;shc.right=shc.top=60;shc.far=300;sun.shadow.bias=-.0004;sc.add(hemi,sun,sun.target);
const S={tool:'orbit',objs:[],sel:null,uid:0,h:3,t:.25,ow:'none',snap:.5,bv:0,m:'concrete',br:4,gd:60,pl:'oak',time:14,wind:1,fog:.05,low:false,cyc:false,pl_:[],hs:[],hi:-1,dw:null,ms:null};
// materials
const M={concrete:['noise','#9b9a95',.9,0],wood:['wood','#8a5a2e',.7,0],marble:['noise','#ece9e2',.15,0],granite:['noise','#5a5a60',.35,0],glass:[0,'#bfe3f0',.05,.1,.35],steel:[0,'#aeb3b8',.3,1],aluminum:[0,'#d0d3d6',.35,1],brick:['brick','#a8492a',.85,0],stone:['noise','#8d8678',.95,0],ceramic:['tile','#f3f3f1',.12,0],asphalt:['noise','#2e2e32',.95,0],sand:['noise','#d9c48e',1,0],soil:['noise','#5a3e28',1,0],water:[0,'#2b73ad',.04,.3,.7],grass:['noise','#4f8f3a',1,0],fabric:['noise','#b24b4b',1,0]};
const tc={};function tex(k){if(tc[k])return tc[k];const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#e8e8e8';g.fillRect(0,0,128,128);
if(k=='noise')for(let i=0;i<2600;i++){const v=165+Math.random()*90|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(Math.random()*128,Math.random()*128,2,2)}
if(k=='brick')for(let r=0;r<4;r++)for(let b=-1;b<3;b++){const v=200+Math.random()*55|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(b*64+(r%2?32:0)+2,r*32+2,60,28)}
if(k=='wood')for(let y=0;y<128;y++){const v=185+Math.sin(y*.5)*25+Math.random()*20|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(0,y,128,1)}
if(k=='tile'){g.fillStyle='#aaa';g.fillRect(0,0,128,3);g.fillRect(0,0,3,128);g.fillRect(64,0,3,128);g.fillRect(0,64,128,3)}
const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.encoding=T.sRGBEncoding;const rp=(k=='brick'||k=='tile')?1:.5;t.repeat.set(rp,rp);return tc[k]=t}
function mat(o){const d=M[o.mat]||M.concrete,op=o.op??d[4]??1,t=d[0]?tex(d[0]):null;return new T.MeshStandardMaterial({color:o.c||d[1],roughness:o.ro??d[2],metalness:o.me??d[3],transparent:op<1,opacity:op,map:t,bumpMap:t,bumpScale:1,side:op<1?T.DoubleSide:T.FrontSide})}
$('#qm').innerHTML=Object.keys(M).map(k=>`<option>${k}`).join('');
// terrain
const N=100,TS=120,tg=new T.PlaneGeometry(TS,TS,N,N);tg.rotateX(-Math.PI/2);const tp=tg.attributes.position,vmap=new Int32Array((N+1)*(N+1));
for(let i=0;i<tp.count;i++){const a=Math.round((tp.getX(i)+TS/2)/TS*N),b=Math.round((tp.getZ(i)+TS/2)/TS*N);vmap[b*(N+1)+a]=i;const d=Math.hypot(tp.getX(i),tp.getZ(i));tp.setY(i,Math.pow(Math.max(0,d-32)/28,2)*9*(.5+.5*Math.sin(tp.getX(i)*.09)*Math.cos(tp.getZ(i)*.07)))}
tg.computeVertexNormals();const tt=tex('noise').clone();tt.needsUpdate=true;tt.repeat.set(30,30);
const TM=new T.Mesh(tg,new T.MeshStandardMaterial({color:0x5b8f3f,roughness:1,map:tt,bumpMap:tt}));TM.receiveShadow=true;sc.add(TM);
function hAt(x,z){const a=Math.round((x+TS/2)/TS*N),b=Math.round((z+TS/2)/TS*N);if(a<0||b<0||a>N||b>N)return 0;return tp.getY(vmap[b*(N+1)+a])}
// grass
const GM=40000,G=[],gg=new T.BufferGeometry();gg.setAttribute('position',new T.BufferAttribute(new Float32Array([-.04,0,0,.04,0,0,0,.6,0]),3));gg.computeVertexNormals();
const U={uT:{value:0},uW:{value:1}},gm=new T.MeshLambertMaterial({side:T.DoubleSide});
gm.onBeforeCompile=s=>{s.uniforms.uT=U.uT;s.uniforms.uW=U.uW;s.vertexShader=s.vertexShader.replace(/void main\(\)\s*\{/,'uniform float uT;uniform float uW;\nvoid main() {').replace('#include <begin_vertex>','vec3 transformed=vec3(position);float sw=sin(uT*2.+instanceMatrix[3].x*.6+instanceMatrix[3].z*.4)*position.y*uW*.5;transformed.x+=sw;transformed.z+=sw*.5;')};
const GI=new T.InstancedMesh(gg,gm,GM);GI.count=0;GI.frustumCulled=false;GI.receiveShadow=true;sc.add(GI);const gd=new T.Object3D(),gc=new T.Color();
function sgi(i){const[x,z,s,r,c]=G[i];gd.position.set(x,hAt(x,z),z);gd.rotation.y=r;gd.scale.set(1,s,1);gd.updateMatrix();GI.setMatrixAt(i,gd.matrix);GI.setColorAt(i,gc.setHSL(.25+c*.07,.55,.28+c*.15))}
function gfin(){GI.count=G.length;GI.instanceMatrix.needsUpdate=true;if(GI.instanceColor)GI.instanceColor.needsUpdate=true}
function ag(x,z){if(G.length<GM){G.push([x,z,.6+Math.random()*1.3,Math.random()*6.28,Math.random()]);sgi(G.length-1)}}
// plants
function mk(k,s){const g=new T.Group(),L=c=>new T.MeshStandardMaterial({color:c,roughness:.9,flatShading:true}),A=(geo,m,p)=>{const x=new T.Mesh(geo,m);x.position.set(...p);x.castShadow=x.receiveShadow=true;g.add(x);return x},br=L(0x6b4a2b);
if(k=='oak'){A(new T.CylinderGeometry(.25,.4,3,8),br,[0,1.5,0]);A(new T.CylinderGeometry(.07,.14,1.8,6),br,[.6,3,0]).rotation.z=-.9;A(new T.CylinderGeometry(.07,.14,1.8,6),br,[-.6,3.2,.2]).rotation.z=.9;
[[0,4.6,0,2],[1.4,3.9,.4,1.4],[-1.3,4.1,-.5,1.5],[.2,3.7,-1.3,1.3]].forEach((v,i)=>A(new T.IcosahedronGeometry(v[3],1),L([0x3f7d34,0x4a8a38,0x356f2e][i%3]),v))}
else if(k=='pine'){A(new T.CylinderGeometry(.18,.3,2,8),br,[0,1,0]);[[2,1.8,2.4],[1.6,3.3,2],[1.1,4.6,1.7],[.6,5.7,1.3]].forEach(v=>A(new T.ConeGeometry(v[0],v[2],9),L(0x2b5e34),[0,v[1]+.6,0]))}
else if(k=='rock'){const r=A(new T.DodecahedronGeometry(.8,0),L(0x85857f),[0,.35,0]);r.scale.set(1.3,.7,1)}
else{A(new T.CylinderGeometry(.015,.015,.5,4),L(0x3f7d34),[0,.25,0]);A(new T.SphereGeometry(.1,8,6),L([0xe84a6a,0xf2d03b,0xffffff,0xa05ae0][Math.random()*4|0]),[0,.52,0])}
g.scale.setScalar(s);return g}
function ap(k,x,z,s){s=s||(.8+Math.random()*.6);const g=mk(k,s);g.position.set(x,hAt(x,z),z);g.rotation.y=Math.random()*6;sc.add(g);S.pl_.push({k,x,z,s,g})}
// camera
const C={th:.9,ph:1,r:34,t:new T.Vector3(0,1,0)},keys={};
function cu(){const{th,ph,r,t}=C;if(walk){cam=PC;cam.position.copy(t);cam.lookAt(t.x-Math.sin(ph)*Math.sin(th),t.y-Math.cos(ph),t.z-Math.sin(ph)*Math.cos(th));return}
cam=ortho?OC:PC;cam.position.set(t.x+r*Math.sin(ph)*Math.sin(th),t.y+r*Math.cos(ph),t.z+r*Math.sin(ph)*Math.cos(th));cam.up.set(0,1,0);cam.lookAt(t);
if(ortho){const a=W/H,s=r*.5;OC.left=-s*a;OC.right=s*a;OC.top=s;OC.bottom=-s;OC.updateProjectionMatrix()}}
function view(n){walk=false;if(n=='top'){C.ph=.01;C.th=0}if(n=='front'){C.ph=Math.PI/2;C.th=0}if(n=='side'){C.ph=Math.PI/2;C.th=Math.PI/2}if(n=='persp'){ortho=false;C.ph=1;C.th=.9}if(n=='ortho')ortho=true;if(n=='walk'){walk=true;ortho=false;C.t.set(0,1.7,14);C.ph=Math.PI/2;C.th=0}}
function rs(){const b=$('#vp').getBoundingClientRect();W=Math.max(1,b.width|0);H=Math.max(1,b.height|0);R.setSize(W,H,false);PC.aspect=W/H;PC.updateProjectionMatrix()}
new ResizeObserver(rs).observe($('#vp'));
// env
function env(){const a=(S.time-6)/12*Math.PI,el=Math.sin(a),day=Math.max(0,Math.min(1,el*3+.3));sun.position.set(Math.cos(a)*90,Math.max(el,.02)*90,35);sun.intensity=Math.max(0,el)*1.3*(1-S.fog*.6);hemi.intensity=.12+.55*day;
const c=new T.Color(0x0a1030).lerp(new T.Color(0x8cbcec),day);if(el>0&&el<.25)c.lerp(new T.Color(0xf0a070),(.25-el)*2);c.lerp(new T.Color(0x9aa0a6),Math.min(1,S.fog*2)*day);sc.background=c;sc.fog=new T.FogExp2(c,.0006+S.fog*.03);U.uW.value=S.wind}
// objects
const bhw=new T.Group();sc.add(bhw);
function geo(o){let g;if(o.k=='wall'){const L=o.L,h=o.h,s=new T.Shape(),a=L/2-.5,b=L/2+.5,x0=-o.t/2,x1=L+o.t/2,dh=Math.min(2.1,h);
s.moveTo(x0,0);if(o.ow=='door'&&L>1.6){s.lineTo(a,0);s.lineTo(a,dh);s.lineTo(b,dh);s.lineTo(b,0)}s.lineTo(x1,0);s.lineTo(x1,h);s.lineTo(x0,h);s.closePath();
if(o.ow=='window'&&L>1.6&&h>2.2){const w=new T.Path();w.moveTo(L/2-.6,1);w.lineTo(L/2+.6,1);w.lineTo(L/2+.6,2.1);w.lineTo(L/2-.6,2.1);w.closePath();s.holes.push(w)}
g=new T.ExtrudeGeometry(s,{depth:o.t,bevelEnabled:false});g.translate(0,0,-o.t/2)}
else{const s=new T.Shape(o.pts.map(p=>new T.Vector2(p[0],-p[1]))),bv=o.bv||0;g=new T.ExtrudeGeometry(s,{depth:o.h,bevelEnabled:bv>0,bevelSize:bv,bevelThickness:bv,bevelSegments:3,curveSegments:24});g.rotateX(-Math.PI/2)}return g}
function build(o){if(o.m){sc.remove(o.m);o.m.geometry.dispose();o.m.material.dispose()}const m=new T.Mesh(geo(o),mat(o));m.castShadow=m.receiveShadow=true;m.position.set(...o.p);m.rotation.y=o.r;m.userData.o=o;m.visible=!o.hd;sc.add(m);o.m=m;if(S.sel==o)hl()}
function add(o){o.id=++S.uid;o.n=o.n||o.k+' '+o.id;o.mat=o.mat||S.m;o.p=o.p||[0,0,0];o.r=o.r||0;S.objs.push(o);build(o);return o}
function hl(){bhw.clear();if(S.sel&&S.sel.m&&!S.sel.hd)bhw.add(new T.BoxHelper(S.sel.m,0xff7a00))}
function sel(o){S.sel=o;hl();ui()}
function del(o){sc.remove(o.m);S.objs=S.objs.filter(x=>x!=o);if(S.sel==o)sel(null);else ui()}
function mkPoly(pts,n){const cx=pts.reduce((a,p)=>a+p.x,0)/pts.length,cz=pts.reduce((a,p)=>a+p.z,0)/pts.length;return add({k:'poly',n,pts:pts.map(p=>[p.x-cx,p.z-cz]),p:[cx,0,cz],h:S.h,bv:S.bv,mat:S.m})}
function mkWall(a,b,o){const dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz);if(L<.1)return;return add(Object.assign({k:'wall',n:'wall',L,p:[a.x,0,a.z],r:-Math.atan2(dz,dx),h:S.h,t:S.t,ow:S.ow,mat:S.m},o||{}))}
const V=(x,z)=>new T.Vector3(x,0,z);
function villa(){const w=[[-6,-4,6,-4,'window'],[6,-4,6,4,'window'],[6,4,-6,4,'door'],[-6,4,-6,-4,'window']];
add({k:'poly',n:'floor slab',pts:[[-6.3,-4.3],[6.3,-4.3],[6.3,4.3],[-6.3,4.3]],h:.25,mat:'marble',p:[0,0,0]});
w.forEach(v=>mkWall(V(v[0],v[1]),V(v[2],v[3]),{ow:v[4],h:3,t:.3,mat:'stone',p:[v[0],.25,v[1]]}));
add({k:'poly',n:'roof',pts:[[-7.2,-5.2],[7.2,-5.2],[7.2,5.2],[-7.2,5.2]],h:.3,bv:.05,mat:'concrete',p:[0,3.25,0]})}
function stairs(){for(let i=0;i<18;i++)add({k:'poly',n:'stair '+(i+1),pts:[[0,-.55],[1.9,-.55],[1.9,.55],[0,.55]],h:.2*(i+1),mat:'wood',p:[14,0,0],r:-i*.33})}
// history / io
const cl=o=>{const c={...o};delete c.m;return JSON.parse(JSON.stringify(c))},js=()=>JSON.stringify(S.objs.map(cl));
function snap(){S.hs=S.hs.slice(0,S.hi+1);S.hs.push(js());if(S.hs.length>60)S.hs.shift();S.hi=S.hs.length-1}
function rest(j){S.objs.forEach(o=>sc.remove(o.m));S.objs=JSON.parse(j);S.objs.forEach(build);S.sel=null;hl();ui()}
const undo=()=>{if(S.hi>0)rest(S.hs[--S.hi])},redo=()=>{if(S.hi<S.hs.length-1)rest(S.hs[++S.hi])};
function pack(){const y=[];for(let b=0;b<=N;b++)for(let a=0;a<=N;a++)y.push(+tp.getY(vmap[b*(N+1)+a]).toFixed(2));return JSON.stringify({v:1,objs:JSON.parse(js()),grass:G.map(g=>g.map(v=>+v.toFixed(2))),pl:S.pl_.map(p=>({k:p.k,x:p.x,z:p.z,s:p.s})),terr:y,env:{time:S.time,fog:S.fog,wind:S.wind}})}
function unpack(j){const d=JSON.parse(j);S.objs.forEach(o=>sc.remove(o.m));S.objs=d.objs;S.objs.forEach(o=>{S.uid=Math.max(S.uid,o.id);build(o)});
if(d.terr)for(let b=0;b<=N;b++)for(let a=0;a<=N;a++)tp.setY(vmap[b*(N+1)+a],d.terr[b*(N+1)+a]);tp.needsUpdate=true;tg.computeVertexNormals();
S.pl_.forEach(p=>sc.remove(p.g));S.pl_=[];(d.pl||[]).forEach(p=>ap(p.k,p.x,p.z,p.s));G.length=0;(d.grass||[]).forEach(g=>G.push(g));G.forEach((_,i)=>sgi(i));gfin();
if(d.env){Object.assign(S,d.env);sync()}S.sel=null;hl();snap();ui()}
function sync(){document.querySelectorAll('#bb [data-s]').forEach(e=>{const v=S[e.dataset.s];if(e.type=='checkbox')e.checked=v;else e.value=v})}

const rc=new T.Raycaster(),mv=new T.Vector2(),gp=new T.Plane(new T.Vector3(0,1,0),0),Pm=new Map(),pvl=new T.Line(new T.BufferGeometry(),new T.LineBasicMaterial({color:0xff7a00}));pvl.frustumCulled=false;sc.add(pvl);
