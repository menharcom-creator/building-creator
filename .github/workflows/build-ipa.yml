name: Build unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 three@0.128.0
          mkdir www
          cp node_modules/three/build/three.min.js www/three.min.js
          sed 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' building-creator.html > www/index.html
          echo '{"appId":"com.menhar.buildingcreator","appName":"Building Creator","webDir":"www"}' > capacitor.config.json
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Landscape only
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" $P
      - name: Build without signing
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r BuildingCreator-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BuildingCreator-unsigned-ipa
          path: BuildingCreator-unsigned.ipa
